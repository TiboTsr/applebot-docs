<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppleBot — Bientôt de retour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --bg-color: #fafbfc;
            --text-color: #1a1a2e;
            --glass-bg: rgba(255, 255, 255, 0.7);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(244, 114, 182, 0.15) 0%, transparent 50%);
            animation: pulseBg 10s infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .container {
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
            transform: translateY(30px);
            opacity: 0;
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
            margin-bottom: 24px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float 6s ease-in-out infinite;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #1a1a2e, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: #5a5a6e;
            margin: 0 0 30px 0;
            line-height: 1.5;
        }

        .loader {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        body.easter-egg-active .background {
            background: linear-gradient(45deg, #ff007f, #7f00ff, #00d4ff);
            background-size: 400% 400%;
            animation: rainbow 5s ease infinite;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body.easter-egg-active .logo {
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes spin {
            100% { transform: rotate(360deg) scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="container">
        <img src="logo.png" alt="AppleBot Logo" class="logo" id="botLogo">
        
        <h1>En cours de mise à jour...</h1>
        <p id="statusText">AppleBot fait peau neuve. La documentation et le site reviennent très bientôt avec de nouvelles fonctionnalités !</p>
        
        <div class="loader" id="loaderDiv">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
      
        const logo = document.getElementById('botLogo');
        const statusText = document.getElementById('statusText');
        const loaderDiv = document.getElementById('loaderDiv');
        let clickCount = 0;
        let timer;

        logo.addEventListener('click', () => {
            clickCount++;
            
            clearTimeout(timer);
            timer = setTimeout(() => { clickCount = 0; }, 2000);

            if (clickCount === 5) {
                document.body.classList.add('easter-egg-active');
                statusText.innerHTML = "🍏 <strong>Easter Egg trouvé !</strong><br>Vous êtes vraiment impatient... Promis je vais aller plus vite !";
                statusText.style.color = "#1a1a2e";
                loaderDiv.style.display = "none";
                
                clickCount = 0;
                
                setTimeout(() => {
                    document.body.classList.remove('easter-egg-active');
                    statusText.innerHTML = "AppleBot fait peau neuve. La documentation et le site reviennent très bientôt avec de nouvelles fonctionnalités !";
                    statusText.style.color = "#5a5a6e";
                    loaderDiv.style.display = "flex";
                }, 6000);
            }
        });
    </script>

</body>
</html>
