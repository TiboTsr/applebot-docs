<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
  <meta charset="utf-8">
  <script>try{var l=localStorage.getItem('ac_lang')}catch(e){}document.documentElement.dataset.lang=l||((navigator.language||'fr').slice(0,2)==='fr'?'fr':'en')</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-fr="Firmwares Apple — AppleCore" data-en="Apple firmwares — AppleCore">Firmwares Apple — AppleCore</title>
  <meta name="description" content="Les dernières versions iOS, iPadOS, macOS, watchOS, visionOS et AirPods détectées par AppleCore : builds, type de release, signature et liens de téléchargement.">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="https://applecore.tibotsr.dev/releases.html">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main"><span lang="fr">Aller au contenu</span><span lang="en">Skip to content</span></a>
  <header id="site-header"></header>

  <main id="main">
    <div class="wrap">
      <div class="page-head">
        <h1><span lang="fr">Firmwares Apple</span><span lang="en">Apple firmwares</span></h1>
        <p><span lang="fr">Les dernières versions détectées par AppleCore. Cherchez un numéro de version ou un build, comme <code>22B83</code>.</span><span lang="en">The latest builds detected by AppleCore. Search by version number or build, like <code>22B83</code>.</span></p>
      </div>

      <div class="page-body" id="root">
        <div class="toolbar">
          <label class="search">
            <span class="sr-only"><span lang="fr">Rechercher une version ou un build</span><span lang="en">Search a version or build</span></span>
            <span id="search-ico" style="display:contents"></span>
            <input id="q" type="search" autocomplete="off" spellcheck="false" data-ph-fr="Version ou build  ( / )" data-ph-en="Version or build  ( / )">
          </label>
          <label class="switch"><input type="checkbox" id="signed"><span class="track"></span><span><span lang="fr">Signées uniquement</span><span lang="en">Signed only</span></span></label>
          <button class="btn btn-ghost btn-sm" type="button" id="reload" style="margin-left:auto"></button>
        </div>
        <div class="toolbar" style="margin-top:-4px">
          <div class="chips" id="os-chips" role="group" aria-label="Système"></div>
        </div>
        <div class="toolbar">
          <div class="chips" id="type-chips" role="group" aria-label="Type de release"></div>
        </div>

        <p class="result-count" id="count" aria-live="polite"></p>
        <div class="rel-list" id="list">
          <div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div>
        </div>
        <div style="text-align:center;margin-top:24px" id="more-wrap" hidden>
          <button class="btn btn-ghost" type="button" id="more"><span lang="fr">Charger plus de sorties</span><span lang="en">Load more releases</span></button>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="config.js"></script>
  <script>
  AC.ready(() => {
    const { $, $$, t, bi, esc, icon, fmtDate, relTime } = AC;
    AC.mountChrome('releases');
    $('#search-ico').innerHTML = icon('search', 18);
    $('#reload').innerHTML = icon('refresh', 15) + bi('Actualiser', 'Refresh');

    const params = new URLSearchParams(location.search);
    const f = { q: params.get('q') || '', os: AC.OS_LIST.includes(params.get('os')) ? params.get('os') : 'all', type: 'all', signed: false };
    $('#q').value = f.q;

    let all = [], page = 1, more = false, live = true, loading = false;

    const slug = r => (['iOS', 'iPadOS', 'macOS', 'watchOS', 'tvOS', 'visionOS'].includes(r.os) ? r.os : null);
    const keyOf = r => `${r.os}|${r.version}|${r.build}`;
    const norm = s => String(s).toLowerCase().replace(/\s+/g, '');

    function filtered() {
      const q = norm(f.q);
      return all
        .filter(r => (f.os === 'all' || r.os === f.os)
          && (f.type === 'all' || r.type === f.type)
          && (!f.signed || r.signed === true)
          && (!q || norm(`${r.os}${r.version}${r.build}`).includes(q)))
        .sort((a, b) => (+new Date(b.date) || 0) - (+new Date(a.date) || 0));
    }

    function renderChips() {
      const osPresent = AC.OS_LIST.filter(o => all.some(r => r.os === o));
      $('#os-chips').innerHTML = [['all', 'Tous les systèmes', 'All systems', null], ...osPresent.map(o => [o, o, o, o])]
        .map(([k, fr, en, o]) => `<button type="button" class="chip" data-os="${esc(k)}" aria-pressed="${f.os === k}">${o ? icon(AC.OS_ICON[o], 15) : ''}${bi(esc(fr), esc(en))}</button>`).join('');
      $('#type-chips').innerHTML = [['all', 'Tous les types', 'All types'], ...Object.entries(AC.TYPES).map(([k, m]) => [k, m.fr, m.en])]
        .map(([k, fr, en]) => `<button type="button" class="chip" data-type="${k}" aria-pressed="${f.type === k}">${bi(fr, en)}</button>`).join('');
    }

    function row(r) {
      const sl = slug(r);
      const dbUrl = sl && r.build ? `https://appledb.dev/firmware/${sl}/${encodeURIComponent(r.build)}.html` : AC.LINKS.appledb;
      const signed = r.os === 'AirPods' || r.signed === undefined ? ''
        : r.signed ? `<span class="badge green">${icon('check', 12)}${bi('Signée', 'Signed')}</span>`
          : `<span class="badge red">${icon('x', 12)}${bi('Non signée', 'Unsigned')}</span>`;
      return `<article class="rel">
        <div class="rel-main">${AC.osIcon(r.os)}<div><div class="rel-title">${esc(r.os)} ${esc(r.version)}</div><div class="rel-build">${esc(r.build) || '—'}</div></div></div>
        <div class="rel-badges">${AC.typeBadge(r.type)}${signed}${r.sample ? `<span class="badge">${bi('Exemple', 'Sample')}</span>` : ''}</div>
        <div class="rel-date">${fmtDate(r.date)}<small>${esc(relTime(r.date))}</small></div>
        <div class="rel-actions">
          ${r.url ? `<a class="btn btn-ghost btn-sm" href="${esc(r.url)}" target="_blank" rel="noopener">${icon('download', 15)}IPSW</a>` : ''}
          <a class="btn btn-ghost btn-sm" href="${esc(dbUrl)}" target="_blank" rel="noopener">AppleDB${icon('external', 13)}</a>
        </div></article>`;
    }

    function render() {
      renderChips();
      const list = filtered();
      $('#count').innerHTML = bi(`${list.length} sortie${list.length > 1 ? 's' : ''} affichée${list.length > 1 ? 's' : ''}`, `${list.length} release${list.length === 1 ? '' : 's'} shown`);
      $('#list').innerHTML = list.length ? list.map(row).join('')
        : `<div class="empty"><h3>${bi('Aucune sortie ne correspond à ces filtres.', 'No release matches these filters.')}</h3>
            <p>${more ? bi('Chargez d’autres sorties pour élargir la recherche, ou retirez un filtre.', 'Load more releases to widen the search, or remove a filter.') : bi('Vérifiez l’orthographe du build ou retirez un filtre.', 'Check the build spelling or remove a filter.')}</p>
            <button class="btn btn-ghost btn-sm" type="button" data-reset>${bi('Réinitialiser les filtres', 'Reset filters')}</button></div>`;
      $('#more-wrap').hidden = !more;
    }

    async function load(reset) {
      if (loading) return; loading = true;
      if (reset) { page = 1; $('#list').innerHTML = AC.skeleton(6); }
      const r = await AC.loadReleases({ page, limit: 60 });
      live = r.live; more = r.more;
      if (reset) all = r.items;
      else { const seen = new Set(all.map(keyOf)); all = all.concat(r.items.filter(x => !seen.has(keyOf(x)))); }
      AC.notice($('#root'), live, () => load(true));
      loading = false; render();
    }

    $('#os-chips').addEventListener('click', e => { const b = e.target.closest('[data-os]'); if (b) { f.os = b.dataset.os; render(); } });
    $('#type-chips').addEventListener('click', e => { const b = e.target.closest('[data-type]'); if (b) { f.type = b.dataset.type; render(); } });
    $('#signed').addEventListener('change', e => { f.signed = e.target.checked; render(); });
    $('#q').addEventListener('input', AC.debounce(e => { f.q = e.target.value; render(); }, 100));
    $('#list').addEventListener('click', e => {
      if (!e.target.closest('[data-reset]')) return;
      Object.assign(f, { q: '', os: 'all', type: 'all', signed: false });
      $('#q').value = ''; $('#signed').checked = false; render();
    });
    $('#more').addEventListener('click', () => { page += 1; load(false); });
    $('#reload').addEventListener('click', () => load(true));
    addEventListener('keydown', e => {
      if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
    });
    document.addEventListener('langchange', render);

    load(true);
  });
  </script>
</body>
</html>
